# Gestione coperchio (clamshell / docked) per ThinkPad L14 Gen 5 AMD.
# - laptop da solo            -> sospendi alla chiusura
# - alimentatore collegato    -> sospendi alla chiusura
# - docked / monitor esterno  -> NON sospendere (continua a lavorare chiuso)
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
