# /etc/tlp.d/10-flower.conf — override personali
# ThinkPad L14 Gen5 AMD · amd-pstate-epp · tlp-pd (3 profili)
#
# IMPORTANTE: con tlp-pd il suffisso NON dipende da AC/batteria ma dal
# PROFILO selezionato (auto da KDE o manuale dal menu batteria):
#
#   _ON_AC  -> profilo "Prestazioni"        (manuale, quando serve potenza)
#   _ON_BAT -> profilo "Bilanciato"         (default quando sei collegato a corrente)
#   _ON_SAV -> profilo "Risparmio energetico" (default quando sei a batteria)

# ===== PRESTAZIONI  (_ON_AC) =====
CPU_ENERGY_PERF_POLICY_ON_AC=performance
PLATFORM_PROFILE_ON_AC=performance
CPU_BOOST_ON_AC=1

# ===== BILANCIATO  (_ON_BAT) — uso quotidiano a corrente =====
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
PLATFORM_PROFILE_ON_BAT=balanced
CPU_BOOST_ON_BAT=1

# ===== RISPARMIO  (_ON_SAV) — default a batteria =====
# Scelte "aggressive" per max autonomia; se lo senti lento metti
# CPU_ENERGY_PERF_POLICY_ON_SAV=balance_power e CPU_BOOST_ON_SAV=1
CPU_ENERGY_PERF_POLICY_ON_SAV=power
PLATFORM_PROFILE_ON_SAV=low-power
CPU_BOOST_ON_SAV=0

# ===== USB =====
# Autosuspend off: evita disconnessioni di dock/periferiche.
USB_AUTOSUSPEND=0
